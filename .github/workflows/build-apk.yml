name: Build branded Android TV APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name shown on the TV (e.g. Maze TV)"
        required: true
        default: "HyDr0"
      package_id:
        description: "Unique package id, lowercase (e.g. com.mybrand.tv)"
        required: true
        default: "com.mazetv.player"
      primary_color:
        description: "Brand color, hex (#RRGGBB)"
        required: true
        default: "#00B4FF"
      portal_url:
        description: "Pre-fill Xtream server URL (optional)"
        required: false
        default: "http://pradahype.com:33726"
      epg_url:
        description: "Default XMLTV EPG URL for M3U users (optional)"
        required: false
        default: ""
      vpn_url:
        description: "URL of an .ovpn profile for the built-in VPN (optional)"
        required: false
        default: ""
      support_text:
        description: "Text shown under the login form"
        required: false
        default: "Contact your provider for login details."
      icon_url:
        description: "URL to a 512x512 PNG — used as the launcher icon, TV banner, AND the in-app logo (optional; initials icon is generated if blank)"
        required: false
        default: ""
      portals:
        description: 'Pre-configured servers as JSON — if set, login shows a picker instead of a raw URL field'
        required: false
        default: '[{"name":"Prada","host":"http://pradahype.com:33726"},{"name":"CDN","host":"http://kytv.xyz"},{"name":"XYZ Live","host":"https://live.xyzchd.io:443"},{"name":"BlackLabel","host":"https://blacklabelx.online:443"}]'
      vod_only:
        description: "Movies & series only (no Live TV, guide, catch-up, multiview or recordings)"
        required: false
        type: boolean
        default: false
      tmdb_api_key:
        description: "Optional TMDB v3 API key — makes Popular Movies/Series use TMDB's weekly trending (leave blank to use the TMDB_API_KEY repo secret if set)"
        required: false
        default: ""
      pair_base_url:
        description: "Your Netlify site URL (e.g. https://mazetv.netlify.app) — enables 'Sign in with a code' on the login screen"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Python deps for branding script
        run: pip install pillow

      - name: Create Android project shell
        run: |
          set -e
          ORG="${{ inputs.package_id }}"
          PROJ="${ORG##*.}"; ORG="${ORG%.*}"
          mkdir -p build && cd build
          flutter create --org "$ORG" --project-name "$PROJ" --platforms android proj
          # drop in our app source over the generated shell
          rm -rf proj/lib proj/test
          cp -r ../app/lib proj/lib
          cp -r ../app/assets proj/assets
          cp ../app/pubspec.yaml proj/pubspec.yaml
          sed -i "s/^name: .*/name: $PROJ/" proj/pubspec.yaml

      - name: Apply branding
        run: |
          python3 tools/brand.py --project build/proj \
            --app-name "${{ inputs.app_name }}" \
            --package "${{ inputs.package_id }}" \
            --color "${{ inputs.primary_color }}" \
            --portal-url "${{ inputs.portal_url }}" \
            --epg-url "${{ inputs.epg_url }}" \
            --vpn-url "${{ inputs.vpn_url }}" \
            --support-text "${{ inputs.support_text }}" \
            --icon "${{ inputs.icon_url }}" \
            --portals '${{ inputs.portals }}' \
            --pair-base-url "${{ inputs.pair_base_url }}" \
            --tmdb-api-key "${{ inputs.tmdb_api_key || secrets.TMDB_API_KEY }}" \
            --repo "${{ github.repository }}" \
            --build-number "${{ github.run_number }}" \
            --vod-only "${{ inputs.vod_only }}"

      - name: Build APK
        working-directory: build/proj
        run: |
          flutter pub get
          flutter --version
          # --split-debug-info keeps a symbol file for the Dart AOT code so a
          # native crash address (pc ...) from logcat can be mapped back to a
          # Dart function. Zipped and attached to the release below.
          # Ship the native libraries compressed inside the APK (~1/3 smaller
          # download; Android unpacks them once at install time).
          for g in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$g" ] && sed -i '0,/^android {/s//android {\n    packaging { jniLibs { useLegacyPackaging = true } }/' "$g"
          done
          # Universal APK (both CPU types, the bit.ly link keeps pointing here) ...
          flutter build apk --release --target-platform android-arm,android-arm64 \
            --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-release.apk ../universal.apk
          # ... plus one per CPU type, each less than half the size. The in-app
          # updater picks whichever matches the device.
          # (no --target-platform here: combined with --split-per-abi it makes
          # Flutter set both ndk.abiFilters and splits, which Gradle rejects.
          # An x86_64 APK gets built too; it just isn't published.)
          flutter build apk --release --split-per-abi --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../arm.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../arm64.apk
          (cd build/symbols && zip -q -r ../../../../symbols-${{ github.run_number }}.zip .)

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            PASS="$KEYSTORE_PASSWORD"; ALIAS="${KEY_ALIAS:-release}"
          else
            echo "::warning::No KEYSTORE_B64 secret set — using a throwaway key. Users will have to uninstall before installing a future build. See README to add a permanent key."
            PASS="changeit"; ALIAS="release"
            keytool -genkeypair -v -keystore release.jks -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=${{ inputs.app_name }}, O=${{ inputs.package_id }}"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SAFE=$(echo "${{ inputs.app_name }}" | tr -cd '[:alnum:]' )
          OUT="${SAFE:-app}-tv.apk"
          for pair in "build/universal.apk:$OUT" "build/arm.apk:${SAFE:-app}-tv-arm.apk" "build/arm64.apk:${SAFE:-app}-tv-arm64.apk"; do
            SRC="${pair%%:*}"; DST="${pair##*:}"
            "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --ks-key-alias "$ALIAS" \
              --out "$DST" "$SRC"
            "$BT/apksigner" verify "$DST"
            ls -la "$DST"
          done
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"
          echo "APK_ARM=${SAFE:-app}-tv-arm.apk" >> "$GITHUB_ENV"
          echo "APK_ARM64=${SAFE:-app}-tv-arm64.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Publish as GitHub Release (stable download URL for Downloader)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ inputs.app_name }} build ${{ github.run_number }}
          files: |
            ${{ env.APK_NAME }}
            ${{ env.APK_ARM }}
            ${{ env.APK_ARM64 }}
            symbols-${{ github.run_number }}.zip

      # Also refresh a fixed per-app release ("HyDr0-latest", "HyDr0Box-latest")
      # so each app has a download URL that never changes:
      #   https://github.com/<repo>/releases/download/<App>-latest/<App>-tv-arm.apk
      # "releases/latest" can't do this once two apps share the repo — it flips
      # to whichever app was built most recently.
      - name: Set per-app release name
        run: echo "APP_SAFE=$(echo '${{ inputs.app_name }}' | tr -cd '[:alnum:]')" >> "$GITHUB_ENV"
      - name: Refresh per-app "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_SAFE }}-latest
          name: ${{ inputs.app_name }} — latest (build ${{ github.run_number }})
          make_latest: false
          overwrite_files: true
          files: |
            ${{ env.APK_NAME }}
            ${{ env.APK_ARM }}
            ${{ env.APK_ARM64 }}
