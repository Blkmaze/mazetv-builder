<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to HyDr0</title>
<style>
  :root {
    --bg:#0a0e16; --panel:#111826; --panel2:#0d1420; --line:#1e2938;
    --text:#e8ecf2; --muted:#8b96a8; --brand:#00b4ff; --brand-dim:#0090cf;
    --ok:#4cd97b; --bad:#ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:
      radial-gradient(600px 320px at 50% -10%, rgba(0,180,255,.16), transparent 60%),
      var(--bg);
    color:var(--text); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    padding:24px;
  }
  .card {
    width:100%; max-width:420px; background:var(--panel);
    border:1px solid var(--line); border-radius:16px; padding:30px 28px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .brand img { width:40px; height:40px; object-fit:contain; filter:drop-shadow(0 0 14px rgba(0,180,255,.45)); }
  .brand span { font-size:20px; font-weight:700; letter-spacing:.3px; }
  h1 { font-size:20px; margin:18px 0 4px; }
  p.hint { color:var(--muted); margin:0 0 22px; font-size:14px; }
  label { display:block; font-weight:600; margin:16px 0 6px; font-size:13px; color:#b7c0cf; text-transform:uppercase; letter-spacing:.4px; }
  input, select {
    width:100%; padding:12px 13px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); font:15px inherit; outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus, select:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(0,180,255,.18); }
  select { appearance:none; }
  button {
    width:100%; margin-top:22px; padding:14px; border:0; border-radius:11px;
    background:linear-gradient(180deg, var(--brand), var(--brand-dim)); color:#04141d;
    font:700 16px inherit; cursor:pointer; box-shadow:0 8px 24px rgba(0,180,255,.28);
  }
  button:disabled { opacity:.5; cursor:default; box-shadow:none; }
  .msg { margin-top:14px; font-size:14px; min-height:18px; }
  .msg.ok { color:var(--ok); } .msg.bad { color:var(--bad); }
  #code {
    text-align:center; font-size:26px; font-weight:700; letter-spacing:10px;
    padding:14px 12px 14px 22px;
  }
</style>
</head>

  <h1>Sign in to your TV</h1>
  <p class="hint">Enter the 6-digit code shown on your TV, then your login details below.</p>
  <form id="f">
    <label>Code from TV</label>
    <input id="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="123456" required>

    <label>Type</label>
    <select id="type"><option value="xtream">Xtream (server + username + password)</option><option value="m3u">M3U playlist link</option></select>

    <div id="xtream-fields">
      <label>Server URL</label>
      <input id="host" placeholder="http://host:port" required>
      <label>Username</label>
      <input id="username" required>
      <label>Password</label>
      <input id="password" type="password" required>
    </div>
    <div id="m3u-fields" style="display:none">
      <label>Playlist URL</label>
      <input id="m3u_host" placeholder="http://&hellip;/playlist.m3u8">
    </div>

    <button type="submit" id="go">Send to TV</button>
    <div class="msg" id="msg"></div>
  </form>
</div>
<script>
const $ = id => document.getElementById(id);

// Scanned from the TV's QR instead of typed: the link carries ?code=123456
// so this is the one field the viewer doesn't have to enter by hand.
const qsCode = new URLSearchParams(location.search).get("code") || "";
if (/^\d{6}$/.test(qsCode)) {
  $("code").value = qsCode;
  document.querySelector('input:not([id="code"]):not([type="password"])')?.focus();
}

$("type").addEventListener("change", e => {
  const isM3u = e.target.value === "m3u";
  $("xtream-fields").style.display = isM3u ? "none" : "block";
  $("m3u-fields").style.display = isM3u ? "block" : "none";
  for (const id of ["host","username","password"]) $(id).required = !isM3u;
  $("m3u_host").required = isM3u;
});
$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("go").disabled = true; $("msg").textContent = "";
  const type = $("type").value;
  const body = { code: $("code").value.trim(), type,
    host: type === "m3u" ? $("m3u_host").value.trim() : $("host").value.trim(),
    username: $("username").value.trim(), password: $("password").value.trim() };
  try {
    const r = await fetch("/.netlify/functions/pair-claim", { method: "POST", body: JSON.stringify(body) }).then(r => r.json());
    if (r.error) throw new Error(r.error);
    $("msg").className = "msg ok"; $("msg").textContent = "Sent — your TV should sign in within a few seconds.";
  } catch (err) {
    $("msg").className = "msg bad"; $("msg").textContent = err.message;
  } finally { $("go").disabled = false; }
});
</script>
